name: Collabro CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Verify Architecture Directories
        run: |
          test -d agents
          test -d orchestrator
          test -d memory
          test -d models
          test -d eval
          echo "Collabro-AI architecture integrity verified."
